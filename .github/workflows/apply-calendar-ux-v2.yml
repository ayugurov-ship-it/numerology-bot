name: Apply calendar UX patch v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch main.py
        run: python calendar_patch.py

      - name: Commit patched main.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add inline birth date calendar"
            git push
          fi
