name: Apply calendar UX patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'feat: add inline birth date calendar'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch bot
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("main.py")
          source = path.read_text(encoding="utf-8")

          assert "import calendar\n" not in source, "Calendar patch already applied"
          source = source.replace("import json\n", "import json\nimport calendar\n", 1)

          helper = r'''

# =====================
# BIRTH DATE INLINE CALENDAR
# =====================

MONTHS_RU = [
    "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
    "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
]
WEEKDAYS_RU = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"]


def birth_years_keyboard(start_decade: int = 1920):
    rows = []
    for decade in range(start_decade, start_decade + 120, 10):
        rows.append([
            InlineKeyboardButton(
                text=f"{decade}–{decade + 9}",
                callback_data=f"birthyear:{decade}"
            )
        ])
    rows.append([
        InlineKeyboardButton(text="◀️ Старше", callback_data=f"birthyears:{start_decade - 120}"),
        InlineKeyboardButton(text="Младше ▶️", callback_data=f"birthyears:{start_decade + 120}")
    ])
    return InlineKeyboardMarkup(inline_keyboard=rows)


def birth_year_keyboard(decade: int):
    rows = []
    years = list(range(decade, decade + 10))
    for i in range(0, 10, 5):
        rows.append([
            InlineKeyboardButton(text=str(year), callback_data=f"birthmonth:{year}")
            for year in years[i:i + 5]
        ])
    rows.append([
        InlineKeyboardButton(text="← К десятилетиям", callback_data="birthyears:1920")
    ])
    return InlineKeyboardMarkup(inline_keyboard=rows)


def birth_month_keyboard(year: int):
    rows = []
    for i in range(0, 12, 3):
        rows.append([
            InlineKeyboardButton(
                text=MONTHS_RU[month - 1],
                callback_data=f"birthcal:{year}:{month}"
            )
            for month in range(i + 1, i + 4)
        ])
    rows.append([
        InlineKeyboardButton(text="← К годам", callback_data="birthyears:1920")
    ])
    return InlineKeyboardMarkup(inline_keyboard=rows)


def birth_calendar_keyboard(year: int, month: int):
    rows = [
        [
            InlineKeyboardButton(text="‹", callback_data=f"birthcal:{year - 1}:12" if month == 1 else f"birthcal:{year}:{month - 1}"),
            InlineKeyboardButton(text=f"{MONTHS_RU[month - 1]} {year}", callback_data=f"birthmonth:{year}"),
            InlineKeyboardButton(text="›", callback_data=f"birthcal:{year + 1}:1" if month == 12 else f"birthcal:{year}:{month + 1}")
        ],
        [InlineKeyboardButton(text=day, callback_data="birthnoop") for day in WEEKDAYS_RU]
    ]

    for week in calendar.monthcalendar(year, month):
        row = []
        for day in week:
            if day == 0:
                row.append(InlineKeyboardButton(text="·", callback_data="birthnoop"))
            else:
                row.append(InlineKeyboardButton(
                    text=str(day),
                    callback_data=f"birthdate:{day:02d}.{month:02d}.{year}"
                ))
        rows.append(row)

    rows.append([
        InlineKeyboardButton(text="← Месяцы", callback_data=f"birthmonth:{year}"),
        InlineKeyboardButton(text="📅 Годы", callback_data="birthyears:1920")
    ])
    return InlineKeyboardMarkup(inline_keyboard=rows)


async def show_birth_date_picker(message: Message):
    await message.answer(
        "📅 *Выберите дату рождения*\n\n"
        "Сначала выберите год, затем месяц и день.\n"
        "Ничего вводить с клавиатуры не нужно.",
        parse_mode="Markdown",
        reply_markup=birth_years_keyboard()
    )


def _birth_history_action(user_id: int) -> str:
    history = storage.personalization["user_history"].get(str(user_id), {})
    actions = history.get("actions", [])
    return actions[-1]["action"] if actions else "profile_request"


async def _run_birth_date_action(callback: types.CallbackQuery, date_str: str):
    user_id = callback.from_user.id
    user_id_str = str(user_id)

    history = storage.personalization["user_history"].setdefault(
        user_id_str,
        {"actions": [], "preferences": {}, "last_interaction": datetime.now().isoformat()}
    )
    history["birth_date"] = date_str
    await storage.save_all(force=True)

    await callback.answer(f"Дата: {date_str}")

    if isinstance(callback.message, Message):
        await callback.message.edit_text(
            f"📅 *Дата рождения сохранена:* {date_str}\n\n✨ Формирую ваш результат...",
            parse_mode="Markdown"
        )

    action = _birth_history_action(user_id)
    if "horoscope" in action:
        await horoscope_handler(callback.message, date_str, action)
    elif action == "numerology_request":
        await process_numerology(callback.message, date_str)
    elif action == "natal_chart_request":
        await natal_chart_handler(callback.message, date_str, None)
    elif action == "daily_card_request":
        await daily_card_handler(callback.message, date_str)
    else:
        await process_profile(callback.message, date_str)


@router.callback_query(lambda c: c.data and c.data == "birthnoop")
async def birth_noop(callback: types.CallbackQuery):
    await callback.answer()


@router.callback_query(lambda c: c.data and c.data.startswith("birthyears:"))
async def birth_years_page(callback: types.CallbackQuery):
    start_decade = int(callback.data.split(":")[1])
    await callback.answer()
    if isinstance(callback.message, Message):
        await callback.message.edit_text(
            "📅 *Выберите год рождения*",
            parse_mode="Markdown",
            reply_markup=birth_years_keyboard(start_decade)
        )


@router.callback_query(lambda c: c.data and c.data.startswith("birthyear:"))
async def birth_year_selected(callback: types.CallbackQuery):
    decade = int(callback.data.split(":")[1])
    await callback.answer()
    if isinstance(callback.message, Message):
        await callback.message.edit_text(
            f"📅 *{decade}–{decade + 9}*\n\nВыберите год:",
            parse_mode="Markdown",
            reply_markup=birth_year_keyboard(decade)
        )


@router.callback_query(lambda c: c.data and c.data.startswith("birthmonth:"))
async def birth_months(callback: types.CallbackQuery):
    year = int(callback.data.split(":")[1])
    await callback.answer()
    if isinstance(callback.message, Message):
        await callback.message.edit_text(
            f"📅 *Выберите месяц — {year}*",
            parse_mode="Markdown",
            reply_markup=birth_month_keyboard(year)
        )


@router.callback_query(lambda c: c.data and c.data.startswith("birthcal:"))
async def birth_calendar(callback: types.CallbackQuery):
    _, year, month = callback.data.split(":")
    year, month = int(year), int(month)
    await callback.answer()
    if isinstance(callback.message, Message):
        await callback.message.edit_text(
            "📅 *Выберите день рождения*",
            parse_mode="Markdown",
            reply_markup=birth_calendar_keyboard(year, month)
        )


@router.callback_query(lambda c: c.data and c.data.startswith("birthdate:"))
async def birth_date_selected(callback: types.CallbackQuery):
    date_str = callback.data.split(":", 1)[1]
    await _run_birth_date_action(callback, date_str)


@router.message(lambda m: m.text == "📅 Изменить дату")
async def change_birth_date(m: Message):
    await show_birth_date_picker(m)
