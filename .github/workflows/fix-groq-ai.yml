name: Fix Groq AI responses

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Groq client
        shell: python
        run: |
          from pathlib import Path
          import py_compile

          path = Path("main.py")
          source = path.read_text(encoding="utf-8")

          source = source.replace(
              'MODEL_NAME = os.getenv("MODEL_NAME", "llama-3.1-8b-instant")',
              'MODEL_NAME = os.getenv("MODEL_NAME", "openai/gpt-oss-20b")',
              1,
          )

          start = source.index('@retry(max_retries=3, backoff_factor=0.5)\nasync def _ask_groq_request')
          end = source.index('\nasync def generate_ai_affirmation', start)

          replacement = r'''@retry(max_retries=3, backoff_factor=1.0)
async def _ask_groq_request(prompt: str, system_prompt_key: str = "default") -> str:
    url = "https://api.groq.com/openai/v1/chat/completions"

    if not GROQ_API_KEY:
        raise RuntimeError("GROQ_API_KEY is not configured")

    headers = {
        "Authorization": f"Bearer {GROQ_API_KEY}",
        "Content-Type": "application/json"
    }

    data = {
        "model": MODEL_NAME,
        "messages": [
            {"role": "system", "content": GROQ_SYSTEM_PROMPTS.get(system_prompt_key, GROQ_SYSTEM_PROMPTS["default"])},
            {"role": "user", "content": prompt}
        ],
        "temperature": 0.6,
        "max_completion_tokens": 1500,
        "reasoning_effort": "low",
        "include_reasoning": false
    }

    async with aiohttp.ClientSession(timeout=aiohttp.ClientTimeout(total=90)) as session:
        async with session.post(url, headers=headers, json=data) as resp:
            response_text = await resp.text()
            if resp.status != 200:
                logger.error("GROQ API ERROR status=%s model=%s body=%s", resp.status, MODEL_NAME, response_text[:1000])
                raise RuntimeError(f"Groq API HTTP {resp.status}")

            try:
                result = json.loads(response_text)
                content = result["choices"][0]["message"].get("content")
            except (KeyError, IndexError, TypeError, json.JSONDecodeError) as exc:
                logger.error("GROQ API INVALID RESPONSE model=%s body=%s", MODEL_NAME, response_text[:1000])
                raise RuntimeError("Invalid Groq response") from exc

            if not content or not content.strip():
                logger.error("GROQ API EMPTY CONTENT model=%s body=%s", MODEL_NAME, response_text[:1000])
                raise RuntimeError("Groq returned empty content")

            logger.info("GROQ OK model=%s chars=%s", MODEL_NAME, len(content))
            return content.strip()


async def ask_groq(prompt: str, system_prompt_key: str = "default") -> str:
    try:
        return await _ask_groq_request(prompt, system_prompt_key)
    except Exception as e:
        logger.error("GROQ ERROR model=%s: %s", MODEL_NAME, e, exc_info=True)
        return "⚠️ Не удалось получить ответ от AI. Попробуйте ещё раз через несколько секунд."
'''

          source = source[:start] + replacement + source[end:]
          py_compile.compile(str(path), doraise=True)
          path.write_text(source, encoding="utf-8")
          print("Groq patch applied and main.py compiles")

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: stabilize Groq AI responses"
            git push
          fi
